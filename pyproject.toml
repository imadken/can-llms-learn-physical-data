[project]
name = "effect-pretraining-stage1"
version = "0.1.0"
description = "Locked exploratory effect-conditioning experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2", "scipy>=1.11"]

[project.optional-dependencies]
experiments = ["torch>=2.7", "matplotlib>=3.8", "h5py>=3.10", "safetensors>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

